<style>

*{box-sizing:border-box;margin:0;padding:0}

  --slip:#ff5d73;--slip-dk:#a8283c;--slipbg:#ffe3e3;--yel:#ffd23f;--yel-dk:#a8820c;--box:#d9a066;--box-dk:#7a4f22;--ok:#4fcf7a;--ok-dk:#1f7a44;--sky:#7ad3ff;

}
html{background:var(--night);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;color:var(--paper);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}

button{font-family:inherit;color:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
#gl{position:fixed;inset:0;width:100vw;height:100svh;display:block;z-index:0;touch-action:none}
main.view{position:fixed;inset:0;z-index:2;height:100svh;overflow:hidden}

/* ---------- 共通部品 */
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.04em;border:0;border-radius:16px;min-height:54px;padding:0 18px;cursor:pointer;width:100%;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 #b3a58e,0 10px 18px rgba(0,0,0,.3);transition:transform .07s,box-shadow .07s;white-space:nowrap}
.btn::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:44%;border-radius:12px 12px 40% 40%/12px 12px 14px 14px;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b3a58e}
.btn svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.red{background:linear-gradient(#ff8597,var(--slip));color:#fff;box-shadow:0 6px 0 var(--slip-dk),0 12px 24px rgba(255,93,115,.3);font-size:22px;min-height:62px;text-shadow:0 2px 0 var(--slip-dk)}
.btn.red:active{box-shadow:0 1px 0 var(--slip-dk)}
.btn.ghost{background:rgba(34,28,46,.66);color:var(--paper);box-shadow:inset 0 0 0 2px rgba(255,248,236,.4);font-size:16px;min-height:48px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.btn.ghost::before{display:none}
.row{display:flex;gap:10px;width:100%}
.row>.btn{flex:1;min-width:0;padding:0 8px}
#corner{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:50;display:flex;gap:6px}
#corner button,#bPause{height:40px;min-width:42px;padding:0 10px;border-radius:12px;border:0;background:rgba(34,28,46,.75);box-shadow:inset 0 0 0 2px rgba(255,248,236,.3);font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--paper)}
#corner svg,#bPause svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- タイトル */
#vTitle{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(58px,calc(env(safe-area-inset-top) + 52px)) 16px max(26px,calc(env(safe-area-inset-bottom) + 20px));background:linear-gradient(rgba(42,34,56,.62),rgba(42,34,56,0) 42%,rgba(42,34,56,0) 58%,rgba(42,34,56,.75))}
.logo{text-align:center;line-height:1;position:relative}
.logo .bell{position:absolute;left:-8px;top:-26px;font-family:var(--disp);font-size:clamp(14px,3.6vw,20px);color:var(--ink);background:var(--yel);padding:5px 10px;border-radius:12px;transform:rotate(12deg);box-shadow:0 3px 0 var(--yel-dk);animation:ding 1.6s ease-in-out infinite;white-space:nowrap}

.logo .l1{display:block;font-family:var(--disp);font-size:clamp(30px,min(10vw,6.5vh),54px);color:#fff;text-shadow:0 4px 0 #120e1a;transform:rotate(-4deg)}
.logo .l2{display:block;white-space:nowrap;font-family:var(--disp);font-size:clamp(56px,min(20vw,12vh),128px);color:var(--slip);text-shadow:0 6px 0 var(--slip-dk),0 0 26px rgba(255,93,115,.5);margin-top:4px;transform:rotate(-4deg)}
html[lang=en] .logo .l1{font-size:clamp(26px,min(8.6vw,6vh),50px)}
html[lang=en] .logo .l2{font-size:clamp(36px,min(11.4vw,8.5vh),84px)}
.logo .sub{display:inline-block;margin-top:14px;font-weight:900;font-size:clamp(13px,3.7vw,17px);padding:7px 14px;border-radius:12px;background:rgba(34,28,46,.85);box-shadow:inset 0 0 0 2px var(--slip);max-width:min(92vw,520px);line-height:1.5}
.tBtns{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}

/* ---------- 遊び方 */
#vHow{display:flex;align-items:center;justify-content:center;padding:max(56px,calc(env(safe-area-inset-top) + 50px)) 14px max(16px,calc(env(safe-area-inset-bottom) + 12px));background:rgba(26,20,36,.62)}
.howCard{width:min(560px,100%);max-height:100%;background:var(--paper);color:var(--ink);border-radius:22px;padding:16px;box-shadow:0 8px 0 #b3a58e,0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;min-height:0}
.howCard h2{font-family:var(--disp);font-weight:400;font-size:24px;text-align:center}
.howList{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.hi{display:flex;gap:12px;align-items:center;background:#f1e7d6;border-radius:14px;padding:8px 10px}
.hi svg{flex:none;width:64px;height:64px}

.hi p{font-size:12.5px;line-height:1.5;color:#4a4256;font-weight:500;margin-top:2px}
.ctrl{font-size:13px;font-weight:800;text-align:center;background:var(--ink);color:var(--yel);border-radius:10px;padding:8px 10px;line-height:1.5}

/* ---------- プレイ中 */
#vPlay{pointer-events:none}
#vPlay .hit{pointer-events:auto}
.hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:calc(max(8px,env(safe-area-inset-right)) + 172px);max-width:520px;display:flex;flex-direction:column;gap:6px}
.stg{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-weight:900;font-size:12px;background:rgba(34,28,46,.8);padding:3px 10px;border-radius:99px;white-space:nowrap}
.stg b{color:var(--yel)}
.pat{position:relative;height:34px;background:rgba(34,28,46,.82);border-radius:12px;box-shadow:inset 0 0 0 2px rgba(255,248,236,.25);display:flex;align-items:center;gap:6px;padding:0 10px 0 4px}
.pat svg.face{width:30px;height:30px;flex:none}
.pat .lab{position:absolute;left:40px;top:2px;font-size:10px;font-weight:900;color:var(--muted);white-space:nowrap}
.pat .bar{position:relative;flex:1;height:10px;margin-top:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.pat .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok);width:100%}
.pat.warn .bar i{background:var(--yel)}
.pat.dang .bar i{background:var(--slip)}
.pat.dang{animation:shake .14s infinite}
@keyframes shake{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.prog{position:relative;height:22px;background:rgba(34,28,46,.7);border-radius:99px;display:flex;align-items:center;padding:0 30px 0 10px}
.prog .bar{position:relative;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.prog .man{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 3px #1b1624;left:0}
.prog svg{position:absolute;right:6px;top:2px;width:18px;height:18px}
#bPause{position:absolute;top:max(8px,env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 124px)}
.dBub{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 110px);transform:translateX(-50%);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-weight:900;font-size:clamp(15px,4.2vw,20px);white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.dBub::before{content:"";position:absolute;left:-12px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--box);border:3px solid var(--ink)}
.dBub.red{background:var(--slipbg);border-color:var(--slip-dk);color:var(--slip-dk)}
@keyframes pop{from{transform:translateX(-50%) scale(.4)}to{transform:translateX(-50%) scale(1)}}
.pBub{position:absolute;max-width:min(56vw,280px);background:var(--yel);color:var(--ink);border-radius:16px;padding:6px 12px;font-weight:900;font-size:15px;line-height:1.3;border:3px solid var(--ink);transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
.pBub::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.ono{position:absolute;font-family:var(--disp);font-size:clamp(30px,min(11vw,9vh),74px);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;transform:translate(-50%,-50%) rotate(-8deg);white-space:nowrap;animation:ono 1s ease-out forwards;pointer-events:none}
.ono.pain{color:var(--slip)}
@keyframes ono{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(.3)}14%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.3)}24%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) rotate(-8deg) scale(1)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.blind{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(ellipse at 50% 52%,rgba(255,227,227,.75),rgba(255,227,227,0) 70%)}
.blind svg{width:min(92vw,92vh);height:auto;animation:flap .25s ease-in-out infinite alternate}
@keyframes flap{to{transform:rotate(4deg) scale(1.03)}}
.blind span{position:absolute;font-family:var(--disp);font-size:clamp(26px,8vw,48px);color:#fff;-webkit-text-stroke:4px var(--slip-dk);paint-order:stroke fill;transform:rotate(-6deg)}
.ctl{position:absolute;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));display:flex;gap:12px}
.ctl.l{left:max(12px,env(safe-area-inset-left))}
.ctl.r{right:max(12px,env(safe-area-inset-right))}
.pad{width:70px;height:70px;border-radius:50%;border:0;background:rgba(34,28,46,.72);box-shadow:inset 0 0 0 3px rgba(255,248,236,.5),0 4px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--paper)}
.pad svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pad.on{background:var(--yel);color:var(--ink)}
.pad.jp{box-shadow:inset 0 0 0 3px var(--sky),0 4px 0 rgba(0,0,0,.35);color:var(--sky)}
.pad.sl{box-shadow:inset 0 0 0 3px var(--yel),0 4px 0 rgba(0,0,0,.35);color:var(--yel)}
.pcmode .ctl,.oc .ctl{display:none}
.keys{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;background:rgba(34,28,46,.6);padding:3px 10px;border-radius:99px}
.spmode .keys{display:none}
.tut{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 160px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:16px;background:rgba(34,28,46,.86);padding:10px 16px;border-radius:14px;white-space:nowrap;box-shadow:inset 0 0 0 2px var(--yel)}
.tut svg{width:150px;height:48px}
.tut .fing{animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
/* ステージの始まり・終わり */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding-top:calc(max(8px,env(safe-area-inset-top)) + 118px);background:linear-gradient(rgba(42,34,56,.7),rgba(42,34,56,.25) 45%,rgba(42,34,56,0) 60%);pointer-events:none}
.intro .no{font-weight:900;font-size:14px;background:var(--ink);color:var(--yel);padding:4px 14px;border-radius:99px;letter-spacing:.12em}
.intro .sit{font-family:var(--disp);font-size:clamp(22px,min(7vw,6vh),40px);color:#fff;text-shadow:0 4px 0 #120e1a;text-align:center;max-width:92vw;line-height:1.2}
.intro .ding{font-family:var(--disp);font-size:clamp(46px,min(16vw,13vh),110px);color:var(--yel);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transform:rotate(-6deg);animation:dingIn .5s cubic-bezier(.2,1.8,.4,1) both;white-space:nowrap}
html[lang=en] .intro .ding{font-size:clamp(38px,min(12vw,11vh),90px)}
@keyframes dingIn{from{transform:rotate(-6deg) scale(.2)}to{transform:rotate(-6deg) scale(1)}}
.outc{position:absolute;left:50%;top:max(60px,calc(env(safe-area-inset-top) + 54px));transform:translateX(-50%);width:min(380px,92vw);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.outc .big{font-family:var(--disp);font-size:clamp(34px,min(12vw,10vh),70px);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transform:rotate(-5deg);white-space:nowrap;animation:dingIn .45s cubic-bezier(.2,1.8,.4,1) both}
.outc .big.ok{color:var(--yel)} .outc .big.ng{color:var(--slip)}
.outc .card{background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 5px 0 #b3a58e,0 12px 26px rgba(0,0,0,.4);text-align:center;width:100%;animation:dingIn .4s .25s cubic-bezier(.2,1.6,.4,1) both}
.outc .card small{display:block;font-size:12px;font-weight:800;color:#6a6076}
.outc .card b{display:block;font-size:clamp(17px,5vw,22px);font-weight:900;line-height:1.3}
.outc .card i{display:block;font-style:normal;font-size:13px;font-weight:800;color:var(--slip-dk);margin-top:2px}
.outc .card.ng{background:var(--slipbg);box-shadow:0 5px 0 var(--slip-dk),0 12px 26px rgba(0,0,0,.4)}
#bNext{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));width:auto;min-width:130px}

/* ---------- 一時停止 */
#vPause{display:flex;align-items:center;justify-content:center;background:rgba(20,16,28,.7);padding:16px}
.pCard{width:min(340px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}
.pCard h2{font-family:var(--disp);font-weight:400;font-size:34px;color:var(--yel)}

/* ---------- 結果 */
#vResult{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(54px,calc(env(safe-area-inset-top) + 50px)) 14px max(14px,calc(env(safe-area-inset-bottom) + 10px));background:rgba(26,20,36,.55)}
.rCard{width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px);min-height:0}
.slipCard{position:relative;background:var(--slipbg);color:var(--ink);border-radius:8px;padding:0 0 12px;box-shadow:0 7px 0 var(--slip-dk),0 16px 34px rgba(0,0,0,.45);overflow:hidden}
.slipCard::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:repeating-linear-gradient(transparent 0 27px,rgba(168,40,60,.12) 27px 28px);pointer-events:none}
.sHead{background:var(--slip);color:#fff;font-weight:900;font-size:15px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.06em}
.sHead span{font-size:11px;opacity:.9;letter-spacing:0}
.sRows{display:flex;flex-direction:column;gap:5px;padding:10px 12px 4px;position:relative}
.sRow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:8px;padding:5px 8px;border:2px dashed rgba(168,40,60,.35);opacity:0;transform:translateX(-16px);transition:opacity .25s,transform .25s}
.sRow.on{opacity:1;transform:none}
.sRow .n{font-family:var(--disp);font-size:13px;color:var(--slip-dk);flex:none;width:20px}
.sRow .it{flex:1;min-width:0;font-weight:900;font-size:13.5px;line-height:1.3}
.sRow .it small{display:block;font-size:11px;color:#6a6076;font-weight:800}
.sRow .tag{flex:none;font-weight:900;font-size:12px;padding:3px 8px;border-radius:6px;border:2px solid currentColor;transform:rotate(-4deg);white-space:nowrap}
.sRow .tag.ok{color:var(--ok-dk)} .sRow .tag.ng{color:var(--slip-dk)}
.sMid{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px 0}
.sNums{display:flex;gap:6px}
.sNums div{background:#fff;border-radius:10px;padding:4px 10px;text-align:center;min-width:72px;box-shadow:inset 0 0 0 2px rgba(168,40,60,.25)}
.sNums span{display:block;font-size:10.5px;font-weight:800;color:#6a6076;white-space:nowrap}
.sNums b{display:block;font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.15}
.sNums .g b{color:var(--ok-dk)} .sNums .m b{color:var(--slip-dk)}
.hanko{flex:none;width:clamp(104px,30vw,128px);height:clamp(104px,30vw,128px);border-radius:50%;border:5px solid #d7263d;color:#d7263d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 3px rgba(215,38,61,.35);opacity:0;padding:6px}

.hanko.show{opacity:1;animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:rotate(-12deg) scale(3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.rLine{position:relative;font-weight:800;font-size:13px;color:#4a4256;text-align:center;padding:6px 12px 0;min-height:1.6em}
.drum{position:absolute;right:16px;bottom:30px;font-weight:900;font-size:13px;color:var(--slip-dk);animation:blink .4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.rBtns{display:flex;flex-direction:column;gap:8px}
.reveal{opacity:0;transition:opacity .3s}
.reveal.on{opacity:1}
.toast{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:900;z-index:80;box-shadow:inset 0 0 0 2px var(--yel)}

/* 小さい縦・背の低い横 */
@media (max-height:700px){
  .hi svg{width:46px;height:46px}.hi p{font-size:11.5px;line-height:1.4}.hi b{font-size:14px}.howCard{gap:7px;padding:12px}
  .btn{min-height:48px;font-size:16px}.btn.red{min-height:54px;font-size:19px}
  .sRow{padding:3px 8px}.sRows{gap:4px;padding-top:8px}.sNums b{font-size:20px}
  .pad{width:62px;height:62px}.pad svg{width:32px;height:32px}
  .dBub{top:calc(max(8px,env(safe-area-inset-top)) + 100px)}
}
@media (max-height:560px) and (orientation:landscape){
  #vTitle{flex-direction:row;justify-content:space-around;padding-top:max(48px,calc(env(safe-area-inset-top) + 40px));padding-bottom:max(20px,calc(env(safe-area-inset-bottom) + 14px))}
  .logo .l2{font-size:clamp(52px,19vh,100px)}
  html[lang=en] .logo .l2{font-size:clamp(32px,11vh,60px)}
  .logo .sub{max-width:44vw}
  .tBtns{width:min(300px,40vw)}
  .howList{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .hi{flex-direction:column;text-align:center;gap:4px;padding:6px}
  .hi svg{width:40px;height:40px}.hi p{font-size:11px;line-height:1.35}.hi b{font-size:13px}
  .howCard{width:min(760px,100%);gap:6px;padding:10px 12px}.howCard h2{font-size:18px}.ctrl{font-size:12px;padding:5px 8px}
  #vResult{padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) 14px;justify-content:center}
  .rCard{width:min(720px,100%);display:grid;grid-template-columns:1.5fr 1fr;gap:10px;align-items:center}
  .slipCard{padding-bottom:6px}
  .sHead{padding:4px 10px;font-size:13px}
  .sRows{padding:6px 10px 2px;gap:3px}.sRow{padding:2px 8px}.sRow .it{font-size:12.5px}.sRow .it small{display:none}
  .sMid{padding:4px 10px 0}.sNums b{font-size:18px}.sNums div{padding:2px 8px;min-width:62px}
  .hanko{width:88px;height:88px;border-width:4px}.hanko b{font-size:15px}
  .rLine{font-size:12px;padding-top:2px}
  .rBtns .btn{min-height:44px;font-size:15px}.rBtns .btn.red{min-height:50px;font-size:17px}
  .rBtns .row{flex-direction:column;gap:8px}
  .hud{right:auto;width:min(40vw,360px)}
  .dBub{top:calc(max(8px,env(safe-area-inset-top)) + 4px);left:auto;right:calc(max(8px,env(safe-area-inset-right)) + 176px);transform:none;animation:none;font-size:15px}
  .pad{width:58px;height:58px}.pad svg{width:30px;height:30px}
  .outc{top:max(10px,env(safe-area-inset-top));width:min(360px,50vw)}
  .outc .big{font-size:clamp(28px,11vh,52px)}
  .intro .ding{font-size:clamp(40px,17vh,80px)}
  .intro{padding-top:calc(max(8px,env(safe-area-inset-top)) + 74px);gap:4px}
  .tut{top:calc(max(8px,env(safe-area-inset-top)) + 96px)}
}
@media (min-width:900px){ .hud{max-width:560px} .pad{width:80px;height:80px} }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="corner">
  <button id="bLang" type="button" aria-label="言語 / Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="langLab">EN</span></button>
  <button id="bMute" type="button" aria-label="音 / Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="icOn" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path id="icOff" d="M16 9l6 6M22 9l-6 6" hidden/></svg></button>
</div>

<main id="vTitle" class="view">
  <div class="logo">
    <span class="bell" data-t="ding">ピンポーン</span>
    <span class="l1" data-t="title1">再配達は</span>
    <span class="l2" data-t="title2">イヤだ！</span>
    <span class="sub" data-t="tag">チャイムが鳴った。宅配便が帰る前に、玄関まで走れ。</span>
  </div>
  <div class="tBtns">
    <button id="bPlay" class="btn red" type="button"><svg viewBox="0 0 24 24"><circle cx="15" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6 11l3-3h4l3 3 3 1M11 8l-2 6"/></svg><span data-t="play">あそぶ</span></button>
    <button id="bHow" class="btn ghost" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg><span data-t="how">遊び方</span></button>
  </div>
</main>

<main id="vHow" class="view" hidden>
  <div class="howCard">
    <h2 data-t="howT">遊び方</h2>
    <div class="howList">
      <div class="hi"><svg viewBox="0 0 64 64"><rect x="36" y="8" width="22" height="48" rx="2" fill="#8a5a32" stroke="#221c2e" stroke-width="3"/><circle cx="52" cy="33" r="2.5" fill="#ffd23f"/><circle cx="18" cy="18" r="6" fill="#ffd9b5" stroke="#221c2e" stroke-width="3"/><path d="M18 24v16M18 40l-8 12M18 40l7 11M18 29l-9 5M18 29l9-4" stroke="#221c2e" stroke-width="4" stroke-linecap="round" fill="none"/></svg><div><b data-t="h1b"></b><p data-t="h1p"></p></div></div>
      <div class="hi"><svg viewBox="0 0 64 64"><rect x="6" y="30" width="18" height="26" rx="2" fill="#d9a066" stroke="#221c2e" stroke-width="3"/><path d="M6 40h18" stroke="#7a4f22" stroke-width="3"/><path d="M30 50c4-4 8-4 12 0M40 22l6-8 6 8" stroke="#221c2e" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="34" y="50" width="22" height="6" rx="2" fill="#ff5d73" stroke="#221c2e" stroke-width="2.5"/><path d="M46 14v20" stroke="#7ad3ff" stroke-width="4" stroke-linecap="round"/></svg><div><b data-t="h2b"></b><p data-t="h2p"></p></div></div>
      <div class="hi"><svg viewBox="0 0 64 64"><rect x="12" y="44" width="16" height="8" rx="1.5" fill="#e83b3b" stroke="#221c2e" stroke-width="3"/><circle cx="16" cy="44" r="2.5" fill="#e83b3b" stroke="#221c2e" stroke-width="2"/><circle cx="24" cy="44" r="2.5" fill="#e83b3b" stroke="#221c2e" stroke-width="2"/><path d="M40 10l4 8 8-6-3 9 9 1-8 5 5 7-9-2-1 9-4-8" fill="#ffd23f" stroke="#221c2e" stroke-width="2.5" stroke-linejoin="round"/></svg><div><b data-t="h3b"></b><p data-t="h3p"></p></div></div>
    </div>
    <p class="ctrl" id="ctrlLine"></p>
    <button id="bHowBack" class="btn" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span data-t="back">もどる</span></button>
  </div>
</main>

<main id="vPlay" class="view" hidden>
  <div class="blind" id="blind" hidden><svg viewBox="0 0 200 160"><path d="M60 10l-50 30 18 34 22-12v88h100V62l22 12 18-34-50-30c-6 14-20 22-40 22S66 24 60 10z" fill="#ff8fa3" stroke="#a8283c" stroke-width="5" stroke-linejoin="round"/><path d="M80 70c10 6 30 6 40 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div>
  <div class="hud">
    <span class="stg"><span data-t="stage">ステージ</span> <b id="stgNo">1/3</b></span>
    <div class="pat" id="pat"><svg class="face" viewBox="0 0 32 32"><circle cx="16" cy="18" r="11" fill="#ffd9b5" stroke="#221c2e" stroke-width="2.5"/><path d="M5 14c1-7 21-7 22 0z" fill="#3a7bd5" stroke="#221c2e" stroke-width="2.5"/><path d="M4 14h26" stroke="#221c2e" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="19" r="1.6" fill="#221c2e"/><circle cx="20" cy="19" r="1.6" fill="#221c2e"/><path id="patMouth" d="M12 24h8" stroke="#221c2e" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span class="lab" data-t="patience">配達員の忍耐</span><div class="bar"><i id="patBar"></i></div></div>
    <div class="prog"><div class="bar"><span class="man" id="progMan"></span></div><svg viewBox="0 0 20 20"><rect x="4" y="1" width="12" height="18" rx="1" fill="#8a5a32" stroke="#fff" stroke-width="1.5"/><circle cx="13" cy="10" r="1.3" fill="#ffd23f"/></svg></div>
  </div>
  <button id="bPause" class="hit" type="button" aria-label="一時停止 / Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
  <div id="fx"></div>
  <div class="flash" id="flash"></div>
  <div class="dBub" id="dBub" hidden></div>
  <div class="pBub" id="pBub" hidden></div>
  <div class="tut" id="tut" hidden><svg viewBox="0 0 150 48"><path d="M20 24h30M30 16l-10 8 10 8M130 24h-30M120 16l10 8-10 8" stroke="#ffd23f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fing"><circle cx="75" cy="20" r="9" fill="#ffd9b5" stroke="#221c2e" stroke-width="3"/><path d="M75 29v14" stroke="#221c2e" stroke-width="4" stroke-linecap="round"/></g></svg><span id="tutTxt"></span></div>
  <div class="intro" id="intro" hidden><span class="no" id="inNo">STAGE 1</span><span class="sit" id="inSit"></span><span class="ding" id="inDing"></span></div>
  <div class="outc" id="outc" hidden><span class="big" id="ocBig"></span><div class="card" id="ocCard"><small id="ocSmall"></small><b id="ocB"></b><i id="ocI"></i></div></div>
  <div class="ctl l"><button class="pad hit" id="bL" type="button" aria-label="左 / Left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="pad hit" id="bR" type="button" aria-label="右 / Right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="ctl r"><button class="pad sl hit" id="bS" type="button" aria-label="スライディング / Slide"><svg viewBox="0 0 24 24"><path d="M5 16h14M8 12l4 4 4-4M12 5v11"/></svg></button><button class="pad jp hit" id="bJ" type="button" aria-label="ジャンプ / Jump"><svg viewBox="0 0 24 24"><path d="M12 19V6M7 11l5-5 5 5M6 21h12"/></svg></button></div>
  <div class="keys" id="keys"></div>
  <button id="bNext" class="btn red hit" type="button" hidden><span data-t="next">次へ</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</main>

<main id="vPause" class="view" hidden>
  <div class="pCard">
    <h2 data-t="paused">ちょっと休憩</h2>
    <button id="bResume" class="btn red" type="button"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span data-t="resume">つづける</span></button>
    <button id="bQuit" class="btn ghost" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg><span data-t="toTitle">タイトル</span></button>
  </div>
</main>

<main id="vResult" class="view" hidden>
  <div class="rCard">
    <div class="slipCard">
      <div class="sHead"><b data-t="card1">ご不在連絡票</b><span data-t="resHead">本日の配達結果</span></div>
      <div class="sRows" id="sRows"></div>
      <div class="sMid">
        <div class="sNums"><div class="g"><span data-t="received">受け取り</span><b id="nGot">0</b></div><div class="m"><span data-t="slips">不在票</span><b id="nMiss">0</b></div></div>
        <div class="hanko" id="hanko"><small data-t="cardStamp">称号</small><b id="hTitle"></b></div>
      </div>
      <p class="rLine reveal" id="rLine"></p>
      <span class="drum" id="drum" data-t="drum">集計中…</span>
    </div>
    <div class="rBtns reveal" id="rBtns">
      <button id="bAgain" class="btn red" type="button"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg><span data-t="again">もう一回</span></button>
      <div class="row">
        <button id="bSave" class="btn ghost" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="save">画像を保存</span></button>
        <button id="bTitle" class="btn ghost" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg><span data-t="toTitle">タイトル</span></button>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__rdReady) return;
    var d=document.createElement('div');d.id='boot-err';d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },8000);
})();
</script>
<script src="data.js?v=1"></script>
<script src="snd.js?v=1"></script>
<script type="module" src="game.js?v=1"></script>
</body>
</html>
